name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Windows app and test core
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test interface
        working-directory: frontend
        shell: pwsh
        run: |
          npx playwright install chromium
          npm test
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipApp
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Windows-x64
          path: |
            build/bin/Sudoku.exe
            build/bin/Sudoku-Setup.exe
          if-no-files-found: error
      - name: Publish tested release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = (Get-Content .github/release-version -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') { $releaseTag = $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $releaseTag already exists; preserving published binaries."
          } else {
            gh release create $releaseTag build/bin/Sudoku.exe build/bin/Sudoku-Setup.exe --target $env:GITHUB_SHA --title "Sudoku $releaseTag" --notes-file build/windows/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
