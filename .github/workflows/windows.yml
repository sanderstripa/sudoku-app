name: Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Windows app and test core
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test interface
        working-directory: frontend
        shell: pwsh
        run: |
          npx playwright install chromium
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-Windows-x64
          path: build/bin/Sudoku.exe
          if-no-files-found: error
