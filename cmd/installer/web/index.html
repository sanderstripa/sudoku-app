<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sudoku</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell">
<header><span>SUDOKU.</span><div class="tools"><button id="language" aria-label="Язык интерфейса">RU</button><button id="theme" class="toggle" role="switch" aria-checked="false" aria-label="Светлая тема"><span></span></button><button id="close" aria-label="Закрыть">×</button></div></header>
<main><img src="assets/icon.png" width="96" height="96" alt="Sudoku"><p class="version">SUDOKU VPN · 0.1.9</p><h1 id="title"></h1><p id="description" class="muted"></p>
<div class="details"><span id="locationLabel"></span><span>Program Files / Sudoku</span></div>
<label id="desktopRow"><span id="desktopLabel"></span><input id="desktop" type="checkbox" checked><span class="check"></span></label>
<div id="progress" hidden><span></span></div><p id="status" role="status"></p><p id="error" role="alert" hidden></p>
<button id="primary" class="primary"></button><button id="secondary" class="secondary" hidden></button>
<p id="note" class="note"></p></main><footer><span id="footer"></span><span>SUDOKU VPN</span></footer>
</div><script>window.setupToken="__TOKEN__";window.uninstallMode=__MODE__;</script><script type="module" src="/wails/runtime.js"></script><script src="setup.js"></script></body></html>
